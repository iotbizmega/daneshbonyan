name: اسکن زنده

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # backstop: زمان‌بندیِ schedule از ۲۶ اوت ۲۰۲۶ در خودِ GitHub خراب است (اجرا ساخته نمی‌شود)؛
  # هر تغییرِ واقعی در منابع/کد، یک دور فوری راه می‌اندازد.
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-live.yml"
      - "agent.py"
      - "sources.json"
      - "channels.txt"

permissions:
  contents: write

concurrency:
  # گروهِ تازه: صفِ workflow پیشین با یک اجرای گیرکرده در وضعیت queued قفل شده بود و
  # هیچ اجرای زمان‌بندی‌شده‌ی تازه‌ای ساخته نمی‌شد؛ فایل تازه = صف و ثبتِ schedule تازه.
  group: scan-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --no-cache-dir -r requirements.txt

      - name: بازیابی وضعیت دور قبل
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch -q --depth 1 origin +refs/heads/state:refs/remotes/origin/state
            git show refs/remotes/origin/state:data/seen.db > data/seen.db || rm -f data/seen.db
          fi

      - name: اجرای یک دور
        env:
          ONCE: "1"
          MAX_CHANNELS: "120"  # سقف کانال‌های پی‌گیری‌شده در هر دور تا اجرا از وقت workflow بیرون نزند
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: python -u agent.py

      - name: ذخیره‌ی وضعیت
        if: always()  # حتی وقتی اجرای دور شکست بخورد ضربان ثبت شود تا وضعیتِ زمان‌بندی قابل پیگیری باشد
        env:
          GIT_TOKEN: ${{ secrets.STATE_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          { date -u '+%Y-%m-%dT%H:%M:%SZ'; echo "event=${EVENT} run=${RUN_ID}"; } > /tmp/heartbeat
          if [ -f data/seen.db ]; then cp data/seen.db /tmp/seen.db; fi
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin +refs/heads/state:refs/remotes/origin/state || true
          if git rev-parse --verify -q refs/remotes/origin/state >/dev/null; then
            git checkout -q -B state refs/remotes/origin/state
          else
            git checkout -q --orphan state
          fi
          mkdir -p data
          if [ -f /tmp/seen.db ]; then cp /tmp/seen.db data/seen.db; fi
          cp /tmp/heartbeat data/heartbeat
          git config user.name "danesh-agent"
          git config user.email "danesh-agent@users.noreply.github.com"
          git add -f data/seen.db data/heartbeat
          git diff --cached --quiet || git commit -q -m "وضعیت موارد دیده‌شده"
          git push -q origin HEAD:state
